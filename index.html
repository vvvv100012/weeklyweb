<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Institutional Insight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .update-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .update-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .content-modules {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .module {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .module h3 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .token-input {
            padding: 8px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
        }

        .instructions {
            background: #e8f4fd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            border-left: 4px solid #3498db;
        }

        .instructions ul {
            list-style-type: none;
            padding-left: 0;
        }

        .instructions li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .instructions li:before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .token-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VIP Institutional Insight</h1>
        </div>

        <div class="update-section">
            <button class="update-btn" onclick="updatePosterData()">Update Poster Data</button>
            <button class="update-btn" onclick="fetchApiData()">Fetch API Data</button>
        </div>

        <div class="content-modules">
            <!-- 模块1: 日期和ETF流量 -->
            <div class="module">
                <h3>市场概览</h3>
                <div class="input-group">
                    <label for="date">日期</label>
                    <input type="date" id="date" name="date">
                </div>
                <div class="input-group">
                    <label for="etf-flow">ETF 流量 (24小时)</label>
                    <input type="text" id="etf-flow" name="etf-flow" placeholder="输入ETF流量数据">
                </div>
            </div>

            <!-- 模块2: 交易所数据 -->
            <div class="module">
                <h3>交易所数据</h3>
                <div class="input-group">
                    <label>CoinEx 上市币种统计</label>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="coins-up">0</div>
                            <div class="stat-label">上涨币种</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="coins-down">0</div>
                            <div class="stat-label">下跌币种</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 模块3: 关注代币 -->
            <div class="module">
                <h3>重点关注代币</h3>
                <div class="input-group">
                    <label>代币监控 (CoinGecko IDs)</label>
                    <div class="token-grid">
                        <input type="text" class="token-input" placeholder="代币1" id="token1">
                        <input type="text" class="token-input" placeholder="代币2" id="token2">
                        <input type="text" class="token-input" placeholder="代币3" id="token3">
                        <input type="text" class="token-input" placeholder="代币4" id="token4">
                        <input type="text" class="token-input" placeholder="代币5" id="token5">
                        <input type="text" class="token-input" placeholder="代币6" id="token6">
                    </div>
                </div>
            </div>

            <!-- 模块4: 新闻动态 -->
            <div class="module">
                <h3>市场动态</h3>
                <div class="input-group">
                    <label for="news">重要新闻 (每行一条)</label>
                    <textarea id="news" name="news" placeholder="输入重要市场新闻，每行一条..."></textarea>
                </div>
            </div>
        </div>

        <div class="instructions">
            <h3>使用说明</h3>
            <ul>
                <li>修改信息后点击"Update Manual Data"更新手动数据</li>
                <li>使用"Fetch API Data"获取最新价格和恐慌贪婪指数</li>
                <li>代币部分请输入CoinGecko ID和您偏好的显示符号</li>
                <li>所有数据会自动保存并用于生成分析报告</li>
            </ul>
        </div>
    </div>

    <script>
        // 设置当前日期
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        function updatePosterData() {
            // 收集所有表单数据
            const data = {
                date: document.getElementById('date').value,
                etfFlow: document.getElementById('etf-flow').value,
                coinsUp: document.getElementById('coins-up').textContent,
                coinsDown: document.getElementById('coins-down').textContent,
                tokens: [
                    document.getElementById('token1').value,
                    document.getElementById('token2').value,
                    document.getElementById('token3').value,
                    document.getElementById('token4').value,
                    document.getElementById('token5').value,
                    document.getElementById('token6').value
                ].filter(token => token.trim() !== ''),
                news: document.getElementById('news').value
            };

            console.log('更新数据:', data);
            alert('数据已更新！');
        }

        async function fetchApiData() {
            try {
                // 这里可以添加API调用逻辑
                // 使用GitHub API key从.env文件
                console.log('正在获取API数据...');
                
                // 模拟API响应
                document.getElementById('coins-up').textContent = Math.floor(Math.random() * 50) + 20;
                document.getElementById('coins-down').textContent = Math.floor(Math.random() * 30) + 10;
                
                alert('API数据已更新！');
            } catch (error) {
                console.error('API调用失败:', error);
                alert('API数据获取失败，请稍后重试');
            }
        }

        // 页面加载时初始化数据
        window.onload = function() {
            fetchApiData();
        };
    </script>
</body>
</html>
